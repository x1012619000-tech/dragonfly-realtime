<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragonfly Real-time data</title>
<meta name="description" content="Dragonfly real-time on-chain settlement command center — aviation × Web3.">
<meta name="theme-color" content="#050607">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="tex/earth-mono.jpg" as="image">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/v3.css">
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="fx-vig"></div>
  <svg id="hud" class="hud-svg" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div id="hubLayer" class="hub-layer"></div>
  <div id="mini" class="mini-globe" aria-label="Navigator globe — drag or click to fly the main globe">
    <svg class="mini-rings" viewBox="-170 -170 340 340" aria-hidden="true"></svg>
    <div class="mini-cap"><span data-i18n="navigator"></span><span class="mono" id="miniLL">31.1N 121.8E</span></div>
  </div>

  <!-- ===== ZONE 1 · left column ===== -->
  <section class="panel z1" id="z1">
    <i class="cnr"></i>
    <div class="brand">
      <img class="brand-logo" src="assets/logo.svg" alt="">
      <div class="brand-txt">
        <h1><span class="h-a">Dragonfly</span> <span class="h-b" data-i18n="titleB">Real-time data</span></h1>
        <div class="micro" data-i18n="subtitle"></div>
      </div>
    </div>
    <div class="sec">
      <header class="sh">
        <span class="ico"><svg viewBox="0 0 16 16"><path d="M2 10.5 14 6l-1.4-1.4-4.6 1.4-4-2.6-1.3.7 2.7 3.3-3.2 1-1.3-1-.7.4 1.3 1.8z" fill="currentColor"/></svg></span>
        <h2 data-i18n="z1a"></h2><span class="sh-sub" data-i18n="liveTag"></span>
        <span class="status" id="scStatus"><i></i><span data-i18n="running"></span></span>
      </header>
      <div class="kgrid">
        <div class="k"><div class="lbl" data-i18n="capitalPool"></div><div class="num v" id="k1"></div><div class="d" id="k1d"></div></div>
        <div class="k"><div class="lbl" data-i18n="monthlyProcurement"></div><div class="num v" id="k2"></div><div class="d" id="k2d"></div></div>
        <div class="k"><div class="lbl" data-i18n="turnover"></div><div class="num v" id="k3"></div><div class="d" id="k3d"></div></div>
        <div class="k"><div class="lbl" data-i18n="activeRoutes"></div><div class="num v" id="k4"></div><div class="d" id="k4d"></div></div>
      </div>
    </div>
    <div class="sec sec-feed">
      <header class="sh">
        <span class="ico"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></span>
        <h2 data-i18n="z1b"></h2>
        <span class="stream"><i></i><span data-i18n="streaming"></span></span>
      </header>
      <div class="feat" id="feat"></div>
      <div class="cols"><span data-i18n="colRoute"></span><span data-i18n="colAmount"></span></div>
      <div class="loop" id="feed"><div class="loop-in"></div></div>
    </div>
  </section>

  <!-- ===== ZONE 2 · top bar ===== -->
  <nav class="z2" id="z2">
    <button class="tab" data-modal="proof"><span class="tab-ic"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.2 10.2 3.6 3.6" stroke="currentColor" stroke-width="1.5"/></svg></span><span data-i18n="tabProof"></span></button>
    <button class="tab" data-modal="commit"><span class="tab-ic"><svg viewBox="0 0 16 16"><path d="M8 2v4M4 7l4-1 4 1M3 10l5 4 5-4M3 10V7M13 10V7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span><span data-i18n="tabCommit"></span></button>
    <button class="tab" data-modal="about"><span class="tab-ic"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4.2M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span data-i18n="tabAbout"></span></button>
    <div class="z2-status">
      <div class="chip-row" id="liveRow"><i class="led"></i><b id="liveMode">SIMULATED</b><span class="sep"></span><span data-i18n="lastSync"></span><span class="num" id="liveTime">--:--:--</span></div>
      <div class="chip-row dim"><span class="num">BASE</span><span class="sep"></span><span data-i18n="block"></span><span class="num" id="hdrBlock">#57,645,446</span></div>
    </div>
  </nav>

  <!-- ===== top-right controls ===== -->
  <div class="tr">
    <div class="clock seg" id="clock">00:00:00</div>
    <div class="date"><span id="weekday">SAT</span><span class="num" id="date">2026-11-15</span><span id="loc">Shanghai</span></div>
    <button class="lang" id="langBtn" type="button" aria-label="Switch language / 切换语言"><span class="l-en">EN</span><span class="l-zh">中文</span></button>
  </div>

  <!-- ===== ZONE 3 · overview ===== -->
  <section class="panel z3" id="z3">
    <i class="cnr"></i>
    <header class="ph"><span class="ico"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="12" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span><h2 data-i18n="z3"></h2><span class="ph-meta num" id="z3Meta">BASE · 8453</span></header>
    <div class="ov">
      <div class="oc"><div class="lbl">TVL</div><div class="num v" id="o_tvl"></div><div class="d warn" data-i18n="stableVault"></div></div>
      <div class="oc"><div class="lbl"><span class="flame"></span><span data-i18n="burned"></span></div><div class="num v" id="o_burn"></div><div class="d"><span data-i18n="partiallyConfirmed"></span> · <span class="dim">Base Mainnet</span></div></div>
      <div class="oc"><div class="lbl" data-i18n="activeRoutes"></div><div class="num v" id="o_routes"></div><div class="d" id="o_routes_d"></div></div>
      <div class="oc wide"><div class="lbl"><span class="flame"></span><span data-i18n="lastWeekBurn"></span></div><div class="num v" id="o_week"></div><div class="d"><b class="unit">MXP</b> · <span data-i18n="prevWeekUtc"></span></div></div>
      <div class="oc wide"><div class="lbl"><span class="bolt"></span><span data-i18n="aprLbl"></span></div><div class="num v" id="o_apr"></div><div class="d"><span data-i18n="bronzeFlyer"></span> · <span data-i18n="centWeighted"></span></div></div>
    </div>
  </section>

  <!-- ===== ZONE 7 · right column ===== -->
  <section class="panel z7" id="z7">
    <i class="cnr"></i>
    <header class="ph"><span class="ico"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="26 9"/></svg></span><h2 data-i18n="z7a"></h2><span class="ph-meta" data-i18n="valueShare"></span></header>
    <div class="dest">
      <div class="donut-box"><svg class="donut" id="donut" viewBox="-80 -80 160 160"></svg></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="note" data-i18n="regionNote"></div>
    <header class="ph ph2"><span class="ico"><svg viewBox="0 0 16 16"><path d="M2 13h12M4 13V8M8 13V4M12 13V9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span><h2 data-i18n="z7b"></h2><span class="ph-meta live-dot" data-i18n="liveTag"></span></header>
    <div class="met">
      <div class="m"><div class="lbl" data-i18n="cumulative"></div><div class="num v gold" id="m1"></div><div class="d" data-i18n="usdcCum"></div><i class="mb"><b style="width:78%"></b></i></div>
      <div class="m"><div class="lbl" data-i18n="avgTime"></div><div class="num v gold" id="m2"></div><div class="d" data-i18n="avgTimeD"></div><i class="mb"><b style="width:18%"></b></i></div>
      <div class="m"><div class="lbl" data-i18n="settledRoutes"></div><div class="num v gold" id="m3"></div><div class="d" data-i18n="routesCum"></div><i class="mb"><b style="width:64%"></b></i></div>
      <div class="m"><div class="lbl" data-i18n="refundRate"></div><div class="num v gold" id="m4"></div><div class="d" data-i18n="refundD"></div><i class="mb"><b style="width:2%"></b></i></div>
    </div>
  </section>

  <!-- ===== ZONE 6 · routes ===== -->
  <section class="panel z6" id="z6">
    <i class="cnr"></i>
    <header class="ph"><span class="ico"><svg viewBox="0 0 16 16"><path d="M2 4h9M2 8h12M2 12h6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></span><h2 data-i18n="z6"></h2><span class="ph-meta" data-i18n="amount24"></span></header>
    <div class="cols"><span data-i18n="colRoute"></span><span data-i18n="colSettled"></span></div>
    <div class="loop" id="bars"><div class="loop-in"></div></div>
  </section>

  <!-- ===== ZONE 4 · liquidity strip ===== -->
  <section class="panel z4" id="z4">
    <i class="cnr"></i>
    <div class="strip">
      <div class="s-main">
        <div class="lbl gold-l" data-i18n="todayTotal"></div>
        <div class="s-big"><span class="cur">$</span><span class="num" id="l_total"></span><span class="unit">USDC</span></div>
      </div>
      <div class="s-root">
        <div class="lbl" data-i18n="settleRoot"></div>
        <div class="num s-hash" id="l_root"></div>
        <a class="link" id="l_verify" target="_blank" rel="noopener"><span data-i18n="verify"></span> ↗</a>
      </div>
      <div class="s-cell"><div class="num v" id="l_tix"></div><div class="lbl"><span data-i18n="settledTickets"></span><i class="sq"></i></div></div>
      <div class="s-cell"><div class="num v" id="l_liq"></div><div class="lbl"><span data-i18n="liquidity"></span><i class="sq"></i></div></div>
      <div class="s-cell"><div class="num v" id="l_fly"></div><div class="lbl"><span data-i18n="inFlight"></span><i class="sq"></i></div></div>
    </div>
  </section>

  <!-- ===== ZONE 5 · partners ===== -->
  <section class="panel z5" id="z5">
    <i class="cnr"></i>
    <div class="z5-head"><span class="lbl" data-i18n="partners"></span><span class="micro" data-i18n="partnersSub"></span></div>
    <div class="marquee" id="marquee"><div class="mq-in" id="mqIn"></div></div>
    <div class="z5-code">DF-05</div>
  </section>

  <!-- hub popover + modals -->
  <div class="pop" id="pop" hidden></div>
  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <div class="fx-grain"></div>
  <div class="fx-scan"></div>
</div>
</div>
<script src="js/app.js"></script>
<script type="module" src="js/globe.js"></script>
</body>
</html>
